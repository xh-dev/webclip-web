<div class="card">
  <div class="card-body d-grid gap-3">
    <div class="row g-2">
      <div class="col-12 col-sm-7">
        <label class="field-label" for="codeInput">Code</label>
        <input type='text' inputmode='numeric' maxlength='6' placeholder='123456' id="codeInput"
               class="code-box"
               #inputBox
               [ngModel]="id | async"
               (keydown.enter)="handleEnter($event)"
               (ngModelChange)="id.next($event)"
               (focus)="isInputting.setInputting()"
               (focusout)="isInputting.setNotInputting()"
        />
      </div>
      <div class="col-12 col-sm-5">
        <label class="field-label" for="secretInput">Secret</label>
        <input type='text' maxlength='3' placeholder='ABC' aria-label="secret" id="secretInput"
               class="code-box" autocapitalize="characters" autocomplete="off"
               [(ngModel)]="secret"
               (keydown.enter)="handleEnter($event)"
               (focus)="isInputting.setInputting()"
               (focusout)="isInputting.setNotInputting()"
        />
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <button (appPaste)="paste($event)">Paste code</button>
      <button [appCp]="id.getValue()">Copy code</button>
      <button [appCp]="secret">Copy secret</button>
      <button [appCp]="shareUrl" (copied)="this.copied($event)">Copy URL</button>
      <span class="text-success align-self-center" *ngIf="cbMsg && !value">{{cbMsg}}</span>
    </div>

    <button class="primary" (click)="submit()">Retrieve</button>

    <div *ngIf="value" class="d-grid gap-2">
      <label class="field-label" id="msg">Message</label>
      <textarea aria-label="msg" rows="6" disabled>{{value|passwordFilter: show}}</textarea>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <button [appCp]="value" (copied)="this.copied($event)">Copy</button>
        <button *ngIf="show" (click)="toggleVisible()">Show</button>
        <button *ngIf="!show" (click)="toggleVisible()">Hide</button>
        <span class="text-success">{{cbMsg}}</span>
      </div>
    </div>
  </div>
</div>
